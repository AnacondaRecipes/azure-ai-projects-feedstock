{% set name = "azure-ai-projects" %}
{% set version = "2.9.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: f85902b1c220f5ef999f7892d5fa8b6f1efecf867c73b107df7de614f5821fd3

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=77.0.3
  run:
    - python
    - isodate >=0.6.1
    - azure-core >=1.37.0
    - typing-extensions >=4.11
    - azure-storage-blob >=12.15.0
    - azure-identity >=1.15.0
    - openai>=3.0.0
  run_constrained:
    - websockets >=13.0
    - aiohttp >=3.9.0,<4.0.0

# Unable to run tests: No azure-devtools -> https://pypi.org/project/azure-devtools
test:
  imports:
    - azure.ai.projects
    - azure.ai.projects._utils
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/ai/azure-ai-projects
  summary: Microsoft Azure AI Projects Client Library for Python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: |
    The AI Projects client library (in preview) is part of the Azure AI Foundry SDK,
    and provides easy access to resources in your Azure AI Foundry Project
  dev_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/ai/azure-ai-projects
  doc_url: https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/ai/azure-ai-projects/README.md

